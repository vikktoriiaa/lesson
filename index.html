<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="style.css" rel="stylesheet">
    <title>Forms</title>
</head>
<body>
  <h1 class="content__title">Форма заявки на работу в зоопарке</h1>
    <p class="content__text">Пожалуйста, заполните форму. Обязательные поля помечены</p>

  <form class="contact">
      <fieldset class="contact__fieldset">
        <legend class="contact__title">Контактная информация</legend>

        <label class="contact__label">Имя <input type="text" required></label>
        <label class="contact__label">Телефон <input type="tel" required></label>
        <label class="contact__label">Email <input type="email" required></label>
      </fieldset>


      <fieldset class="person">
        <legend>Персональная информация</legend>

        <label for="age">Возраст</label>
        <input id="age" type="number" min="0" required><br>
        <label for="gender">Пол</label>
        <select id="gender">
          <option value="woman">Женщина</option>
          <option value="man">Мужчина</option>
        </select><br>
        <label for="message">Перечислите личные качества</label>
        <textarea id="message"></textarea>
      </fieldset>

      <fieldset class="animals">
        <legend>Выберите ваших любимых животных</legend>

        <label class="animals__label"><input type="checkbox">Зебра</label>
        <label class="animals__label"><input type="checkbox">Кошак</label>
        <label class="animals__label"><input type="checkbox">Анаконда</label>
        <label class="animals__label"><input type="checkbox">Человек</label>
        <label class="animals__label"><input type="checkbox">Слон</label>
        <label class="animals__label"><input type="checkbox">Антилопа</label>
        <label class="animals__label"><input type="checkbox">Слон</label>
        <label class="animals__label"><input type="checkbox">Краб</label>
      </fieldset>
    </form>
  
    <input type="submit" value="Отправить информацию">
</body>
</html>
